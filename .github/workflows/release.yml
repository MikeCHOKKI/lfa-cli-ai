name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Build binary
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          make build-matrix GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} EXT="${{ matrix.ext }}" VERSION="$VERSION"
          mkdir -p dist
          mv bin/lfa-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} dist/
          cd dist && sha256sum lfa-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} > lfa-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: "lfa-${{ matrix.goos }}-${{ matrix.goarch }}"
          path: dist/*

  create-release:
    name: Create Release
    needs: [goreleaser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: "lfa-*"
          path: dist
          merge-multiple: true
      - name: Generate changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1 || echo "")
          {
            echo "## LFA CLI ${TAG}"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "### Changelog"
              echo ""
              git log "${PREV_TAG}..${TAG}" --pretty=format:"- %s" --no-merges
              echo ""
            fi
            echo ""
            echo "### Binaries"
            echo ""
            for f in dist/lfa-*; do
              name=$(basename "$f")
              if [[ "$name" != *.sha256 ]]; then
                echo "- \`$name\`"
              fi
            done
          } > release-notes.md
          cat release-notes.md
      - name: Upload assets & update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
